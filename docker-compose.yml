services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: socialhandler
      POSTGRES_PASSWORD: socialhandler
      POSTGRES_DB: socialhandler
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialhandler -d socialhandler"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: